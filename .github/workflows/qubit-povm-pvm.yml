name: Qubit POVM-PVM formal and exact verification

on:
  push:
    paths:
      - "qubit_povm_pvm_minimum_settings/**"
      - ".github/workflows/qubit-povm-pvm.yml"
  pull_request:
    paths:
      - "qubit_povm_pvm_minimum_settings/**"
      - ".github/workflows/qubit-povm-pvm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qubit_povm_pvm_minimum_settings
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: qubit_povm_pvm_minimum_settings/.python-version
          cache: pip
          cache-dependency-path: qubit_povm_pvm_minimum_settings/requirements.txt
      - run: python -m pip install --requirement requirements.txt
      - run: PYTHON=python ./run_all.sh
      - uses: wtfjoke/setup-tectonic@v4.0.5
        with:
          tectonic-version: "0.16.9"
      - run: ./paper/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: qubit-povm-pvm-pdfs
          path: |
            qubit_povm_pvm_minimum_settings/paper/main.pdf
            qubit_povm_pvm_minimum_settings/paper/review.pdf

  lean:
    name: Lean proofs, statement contracts, and axiom audit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: qubit_povm_pvm_minimum_settings/bell_lean
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: qubit_povm_pvm_minimum_settings
      - uses: actions/setup-python@v7
        with:
          python-version-file: qubit_povm_pvm_minimum_settings/.python-version
      - name: Install verifier dependencies
        run: python -m pip install --requirement requirements-preflight.txt
      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      - name: Run verifier regression and exact preflight checks
        run: python scripts/preflight_all.py
      - name: Rebuild every project proof and check contracts and axioms
        # The runner checks all dependency revisions and the compiler commit.
        # Only dependency build artifacts are reused, never project outputs.
        run: python scripts/run_lean.py --bootstrap --serial
      - name: Check independent expanded physical endpoint
        run: lake env lean ../hardening_audit_20261024/MainEndpointProbe.lean
      - name: Test replay driver failure handling
        run: python -m unittest discover -s ../hardening_audit_20261024 -p test_run_replay.py
      - name: Replay the main theorem dependency closure in an empty kernel environment
        run: python ../hardening_audit_20261024/run_replay.py --root . --output ../hardening_audit_20261024/ci_replay
      - name: Preserve run-specific verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qubit-povm-pvm-lean-${{ github.sha }}
          path: |
            qubit_povm_pvm_minimum_settings/bell_lean/reports/latest_run.json
            qubit_povm_pvm_minimum_settings/bell_lean/reports/runs/
            qubit_povm_pvm_minimum_settings/bell_lean/reports/preflight/
            qubit_povm_pvm_minimum_settings/hardening_audit_20261024/ci_replay/
          if-no-files-found: warn
