name: Bimolecular positive recurrence release checks

on:
  push:
    paths:
      - "bimolecular_positive_recurrence/**"
      - ".github/workflows/bimolecular-positive-recurrence.yml"
  pull_request:
    paths:
      - "bimolecular_positive_recurrence/**"
      - ".github/workflows/bimolecular-positive-recurrence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-verifier:
    name: Standalone verifier (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Reproduce stable report
        working-directory: bimolecular_positive_recurrence/code
        run: ./reproduce.sh

  archived-audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: bimolecular_positive_recurrence/requirements-tested.txt
      - name: Install archived-audit dependencies
        working-directory: bimolecular_positive_recurrence
        run: python -m pip install --requirement requirements-tested.txt
      - name: Run Phase II and Phase V tests
        working-directory: bimolecular_positive_recurrence
        run: python -m pytest -q phase2_trigger_drain/tests phase5_source_flag_closure/tests
      - name: Run aggregate audit entry points
        working-directory: bimolecular_positive_recurrence
        env:
          PYTHONPATH: .
        run: |
          python -m phase2_trigger_drain.src.phase2_verifier
          python -m phase3_defect_credit.src.phase3_verifier
          python -m phase4_critical_lamperti.src.phase4_independent_verifier
          python -m phase5_source_flag_closure.src.phase5_independent_verifier
      - name: Require deterministic archived certificates
        run: git diff --exit-code -- bimolecular_positive_recurrence
      - name: Verify the complete release manifest
        working-directory: bimolecular_positive_recurrence
        run: python supplement/verify_manifest.py

  manuscript-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: wtfjoke/setup-tectonic@v4.0.5
        with:
          tectonic-version: "0.16.9"
      - name: Compile both manuscript wrappers
        working-directory: bimolecular_positive_recurrence/manuscript
        run: ./build.sh
