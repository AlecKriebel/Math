<meta name="DC.description" content="Combining OpenAI&#x27;s rational Hodge theorem for arbitrary mixed products of projective K3 surfaces with Bülles&#x27; Chow-motive decomposition, we record rational Hodge in every codimension for finite mixed products of the smooth projective K3 moduli spaces covered by that decomposition. The factors may have different K3 bases and include Hilbert schemes, twisted stable-sheaf moduli, and eligible moduli of Bridgeland-stable objects. We give the explicit pull-push argument, retaining smoothness, projectivity, and stability hypotheses. The contribution is an assembled corollary of the cited results; it supplies neither a new proof of the base K3 theorem nor a new motivic reduction.">
