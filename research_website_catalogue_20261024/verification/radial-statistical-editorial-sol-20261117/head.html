      "description": "An explicit statistical geometry counterexample: every radial orthogonal distribution is integrable, while the dual is nowhere locally 1-conformally flat.",
      "abstract": "We give a negative answer to Kurose's Question 3(e) in the 1998 collection Open Problems in Affine Differential Geometry and Related Topics. For the product S²(1) × ℝ with its product metric and Levi–Civita connection, every radial orthogonal distribution in that question is integrable, but the dual statistical structure is nowhere locally 1-conformally flat. Integrability follows from the first variation of energy; nonflatness follows from two curvature evaluations. A conformal metric and projective connection change also give an example with nowhere zero cubic tensor. The same obstruction works in every dimension at least three. The proof is independent of computation. Historical priority is unresolved; no claim of a first resolution is made.",
