<meta name="DC.description" content="For a simple labelled graph, consider the full configuration space, including vertex collisions, partitioned into connected components of coordinate-sign equivalence classes of self-stress spaces. We prove that two graphs induce identical partitions precisely when their edge sets agree. More explicitly, an edge is recovered by asking whether its collision diagonal is a union of strata. This answers the literal equality formulation of Karpenkov&#x27;s Problem 4. The proof combines the known singleton-support collision criterion with an explicit positive diagonal transport along a collinear path. The comparison convention is essential: nonisomorphic trees can have ambient-linearly equivalent stratifications.">
