<meta name="DC.description" content="For the ordinary full SU(5) Reshetikhin–Turaev invariant at WZW level k=5, or shifted level r=10, the lens spaces L(5,1) and L(5,2) have fundamental group ℤ/5 but unequal nonzero magnitudes. With τ̂(S³)=1, their squared magnitudes are 3475+1550√5 and 4025+1800√5. A short exact root-lattice reduction proves the calculation, conditional on the established modular-category and surgery formulas; finite cyclotomic programs provide reproducible checks. This contradicts Conjecture 7.5 as printed in Ohtsuki's collection. Historical priority is unresolved: Takahito Kuriya's directly relevant preprint could not be obtained, and no firstness or new historical resolution is claimed. This is an unrefereed research note with extensive AI assistance and no conventional human peer review.">
