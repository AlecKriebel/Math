<meta name="DC.description" content="We derive two separately motivated consequences of precisely identified input theorems in OpenAI&#x27;s mathematics collection. The torsion-free group-algebra counterexample, combined with the established Hopfian embedding framework, yields a finitely generated Hopfian group H for which the standard restricted regular wreath product C₂ wr H is non-Hopfian. We give its split epimorphism and kernel explicitly. The sharp planar two-point Fourier certificate, combined with the Cohn–de Laat–Salmon product-program comparison and triangular-lattice Poisson bounds, yields L₂ = 2/√3 and the exact planar triangle infimum P₂ = 4/3. We reconstruct the deductions, audit the substantive inputs, repair product-proof bookkeeping, and provide independently implemented validated computations and source records. These consequences use credited literature; no first-priority or independent-breakthrough claim is made. The planar equality does not settle the all-dimensional triangle problem or assert attainment of its infimum.">
