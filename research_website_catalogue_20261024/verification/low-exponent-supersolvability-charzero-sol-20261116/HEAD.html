<meta name="DC.description" content="We prove that every finite central free arrangement over a field of characteristic zero whose nonzero exponents are 1 or 2, with at most one 3, is supersolvable. Factorization and linear-relation formality restrict the incidence graph of the multiple rank-two flats to a tree or a subdivision of K4 with trees attached. A direct modular-coatom argument then gives a maximal modular chain in every rank. This proves the full conjecture stated in Tohăneanu's Oberwolfach contribution. We credit the earlier all-2, tree, rank-three and modular-pruning results and acknowledge Ferudun's later matching full-target preprint. The accompanying package preserves the dated candidate, source audit and exact computational diagnostics. AI tools were used extensively in developing, writing and checking this work. This preprint is unrefereed; its internal AI reviews are not human peer review.">
