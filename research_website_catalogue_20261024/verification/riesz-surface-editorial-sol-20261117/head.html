<meta name="DC.description" content="We deduce the exact two-dimensional hypersingular minimal Riesz-energy constant for every real s&gt;2 from OpenAI&#x27;s recently released triangular-lattice universal-optimality theorem. The constant is the Epstein sum of the covolume-one triangular lattice. An explicit gap-periodization argument relates the finite square problem to the source theorem&#x27;s centered-disk lower energy, with an inter-box error of order N^(1−s/2) for each fixed gap parameter. A lattice crop gives the matching upper bound. The corrected Hardin–Saff universality theorem then gives the ordered-pair leading asymptotic on every smooth compact embedded surface of positive area, including surfaces with smooth boundary, for ambient Euclidean distance. This resolves the two-dimensional s&gt;2 case of the explicit lattice-constant conjecture recorded by Brauchart, Hardin and Saff. The universal-optimality breakthrough, finite-to-infinite reduction and manifold theorem are inherited results; this note gives a self-contained account of the known passage and records its planar surface consequence.">
