<meta name="DC.description" content="We construct a bounded-degree physical tree model in which the normalized marginal admitted demand drops from one to zero while the spare-capacity graph changes from the entire tree to isolated vertices. Capacities arise from the unique cheapest fixed-topology enlargement supporting doubled initial traffic. Each of the k² cross-root streams has an independent, fixed-law exponential growth rate. An all-cuts estimate confines both changes, with probability tending to one, to an interval of width 16√(log k/k) around mean doubled demand. Both outer-phase conclusions hold for every optimizer. This is a specialized existence response to Aldous&#x27;s conceptual congestion toy-model request. The width is an upper bound; no critical profile or universal traffic law is asserted.">
