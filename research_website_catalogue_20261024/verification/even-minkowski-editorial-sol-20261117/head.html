<meta name="DC.description" content="We record consequences of OpenAI&#x27;s recently released origin-symmetric logarithmic Brunn–Minkowski inequality. For every ambient dimension n ≥ 2 and 0 ≤ p &lt; 1, every smooth strictly positive even density on Sⁿ⁻¹ has exactly one smooth positive even support-function solution of h¹⁻ᵖ det(∇²h+hI)=f, with positive curvature-radius matrix. For 0 &lt; p &lt; 1, identical Lₚ surface-area measures determine arbitrary full-dimensional origin-symmetric convex bodies. We give the nonsmooth first-variation and strictness argument explicitly and a local version of the smooth endpoint transfer of He–Liu. Existence and regularity are established inputs. These are consequences of the new inequality and known reductions, not a new proof of logarithmic Brunn–Minkowski or a claim of first public announcement. Equal-volume boxes exclude arbitrary-measure uniqueness at p=0.">
