<meta name="DC.description" content="OpenAI&#x27;s October 4 construction uses a projective plane of order q=128 and seven extra letters to obtain a finitely presented torsion-free group with a finite two-dimensional classifying complex and a characteristic-two group algebra that is not directly finite. We determine the least dyadic order q≥4 at which its unchanged squared turn weights have exponential word-mass decay: it is q=32. A three-class reduction and exact rational certificates prove contraction at 32 and exponential growth at 4,8,16. Checking the remaining parameter-dependent estimates yields the same construction on a 532-edge rose. This is a threshold for this specified model, rather than an optimum among all group-algebra examples. Classical HNN embedding also gives a two-generator realization. We spell out the inherited scalar idempotent and nonzero absorbed cyclic projective module, which remain valid over every characteristic-two field. The construction is existential; no numerical matching or group-ring multiplication certificate is claimed.">
