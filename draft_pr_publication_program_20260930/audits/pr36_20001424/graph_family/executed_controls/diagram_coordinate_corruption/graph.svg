<svg xmlns="http://www.w3.org/2000/svg" width="470" height="500" viewBox="0 0 470 500">
<rect width="470" height="500" fill="white"/>
<g font-family="sans-serif" fill="#17212b">
<text x="24" y="28" font-size="19" font-weight="600">The degree-11 charge graph</text>
<text x="24" y="50" font-size="12">Quarter-circle cycle, with pendant lengths 1, 2, 1, 2</text>
<g stroke="#24384b" stroke-width="2.4" fill="none">
<circle cx="270" cy="180" r="75"/>
<path d="M345 180 L307.5 180 M270 105 L270 142.5 L270 155 M195 180 L120 180 M270 255 L270 330 L270 405"/>
</g>
<g fill="#155fa0" stroke="white" stroke-width="1.5">
<circle cx="345" cy="180" r="5"/><circle cx="270" cy="105" r="5"/>
<circle cx="195" cy="180" r="5"/><circle cx="270" cy="255" r="5"/>
<circle cx="307.5" cy="180" r="4.5"/><circle cx="270" cy="142.5" r="4.5"/>
<circle cx="270" cy="155" r="4.5"/><circle cx="110" cy="180" r="4.5"/>
<circle cx="270" cy="330" r="4.5"/><circle cx="270" cy="405" r="4.5"/>
</g>
<g font-size="13">
<text x="354" y="184">v0 = 1</text><text x="280" y="96">v1 = i</text>
<text x="143" y="166">v2 = -1</text><text x="280" y="265">v3 = -i</text>
<text x="298" y="200">1/2</text><text x="281" y="141">i/2</text>
<text x="227" y="158">i/3</text><text x="95" y="200">-2</text>
<text x="280" y="334">-2i</text><text x="280" y="411">-3i</text>
</g>
<text x="24" y="449" font-size="13">J(z) = -1 / conjugate(z) pairs opposite paths</text>
<text x="24" y="470" font-size="12">The drawing specifies the embedded graph, not the rational map’s coordinates</text>
</g></svg>
