# Generated by environment/make_workflow.py; the embedded scripts are also shipped separately.
# Only prepares the exact compiler/dependencies. It does NOT claim to prove the paper.
# Put this one file at .github/workflows/bell-lean-offline.yml in AlecKriebel/Math.
name: Bell Lean 4.19 offline environment

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/bell-lean-offline.yml

permissions:
  contents: read

concurrency:
  group: bell-lean-offline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      BELL_EXPORT_REPOSITORY: ${{ github.repository }}
      BELL_EXPORT_COMMIT: ${{ github.sha }}
      BELL_EXPORT_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Materialize the embedded exact pins and bootstrap scripts
        shell: bash
        run: |
          set -euo pipefail
          cat > export_environment.py <<'BELL_EOF_EXPORT_ENVIRONMENT_PY'
          #!/usr/bin/env python3
          """Export the project's exact Linux Lean/Mathlib environment on an ONLINE host.
          
          This script is not a proof of the paper. It validates toolchain smoke tests only.
          The companion workflow runs this on GitHub Actions without repository writes.
          """
          from __future__ import annotations
          import argparse
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timezone
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import shutil
          import subprocess
          import tarfile
          import time
          import urllib.request
          
          LEAN_HASH = '6caaee842e9495688c1567e78c0e68dbb96942aa'
          TOOLCHAIN = 'leanprover/lean4:v4.19.0'
          ASSET = 'https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst'
          ASSET_BYTES = 343842845
          PART_BYTES = 400 * 1024 * 1024
          MAX_PARTS = 12
          BUNDLE_NAME = 'bell-lean419-environment'
          PART_PREFIX = 'bell-lean419-linux-x64.tar.gz.part-'
          FONT_SUFFIXES = {'.ttf', '.otf', '.woff', '.woff2', '.eot'}
          
          POSITIVE = '''import Mathlib\nnamespace EnvironmentSmoke\ntheorem square_identity (a b : ℝ) : (a+b)^2 = a^2 + 2*a*b + b^2 := by\n  ring\n#print axioms square_identity\nend EnvironmentSmoke\n'''
          NEGATIVE = '''import Mathlib\nexample : (1 : ℝ) = 0 := by\n  norm_num\n'''
          
          
          def sha(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024*1024), b''):
                      h.update(chunk)
              return h.hexdigest()
          
          
          def write_json(path: Path, value: object) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(value, indent=2, sort_keys=True) + '\n')
          
          
          def run(command: list[str], cwd: Path, log: Path, env: dict[str, str] | None = None,
                  allow_failure: bool = False) -> tuple[int, str]:
              print('+', ' '.join(command), flush=True)
              log.parent.mkdir(parents=True, exist_ok=True)
              with log.open('w') as stream:
                  result = subprocess.run(command, cwd=cwd, env=env, stdout=stream,
                                          stderr=subprocess.STDOUT, check=False)
              text = log.read_text(errors='replace')
              if result.returncode and not allow_failure:
                  print(text[-12000:], flush=True)
                  raise RuntimeError(f'Command failed ({result.returncode}); see {log}')
              return result.returncode, text
          
          
          def fetch_dependency(package: dict, directory: Path, logs: Path) -> None:
              name, rev = package['name'], package['rev']
              target = directory / name
              target.mkdir()
              run(['git', 'init', '-q'], target, logs/f'{name}-init.log')
              run(['git', 'remote', 'add', 'origin', package['url']], target, logs/f'{name}-remote.log')
              for attempt in range(3):
                  status, text = run(['git', '-c', 'core.autocrlf=false', 'fetch', '--depth=1',
                                      'origin', rev], target, logs/f'{name}-fetch.log', allow_failure=True)
                  if status == 0:
                      break
                  if attempt == 2:
                      raise RuntimeError(f'Cannot fetch exact dependency {name}@{rev}: {text[-3000:]}')
                  time.sleep(5 * (attempt+1))
              run(['git', '-c', 'core.autocrlf=false', 'checkout', '--detach', 'FETCH_HEAD'],
                  target, logs/f'{name}-checkout.log')
              actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=target, text=True).strip()
              if actual != rev:
                  raise RuntimeError(f'Dependency pin mismatch: {name}: {actual} != {rev}')
          
          
          def smoke(root: Path, relative_paths: list[str], phase: str) -> dict:
              workspace = root/'workspace'
              receipts = root/'receipts'
              env = os.environ.copy()
              env['PATH'] = str(root/'runtime/bin') + os.pathsep + env.get('PATH', '')
              env['LEAN_PATH'] = os.pathsep.join(str(root/p) for p in relative_paths)
              env.pop('LEAN_SYSROOT', None)
              lean = str(root/'runtime/bin/lean')
              _, version = run([lean, '--version'], workspace, receipts/f'{phase}-version.log', env)
              _, git_hash = run([lean, '--githash'], workspace, receipts/f'{phase}-githash.log', env)
              if git_hash.strip() != LEAN_HASH:
                  raise RuntimeError('Unexpected Lean executable revision')
              (workspace/'EnvironmentSmoke.lean').write_text(POSITIVE)
              (workspace/'EnvironmentNegative.lean').write_text(NEGATIVE)
              positive_status, positive_text = run(
                  [lean, '-o', 'EnvironmentSmoke.olean', 'EnvironmentSmoke.lean'],
                  workspace, receipts/f'{phase}-positive.log', env)
              negative_status, negative_text = run([lean, 'EnvironmentNegative.lean'],
                  workspace, receipts/f'{phase}-negative.log', env, allow_failure=True)
              if positive_status != 0 or 'sorryAx' in positive_text:
                  raise RuntimeError('The positive smoke theorem did not pass cleanly')
              if negative_status == 0 or 'unsolved goals' not in negative_text:
                  raise RuntimeError('The negative smoke test was not rejected as expected')
              return {'phase': phase, 'version': version.strip(), 'lean_git_hash': git_hash.strip(),
                      'positive_exit': positive_status, 'negative_exit': negative_status,
                      'smoke_only': True, 'paper_kernel_checked': False}
          
          
          def export(work: Path, output: Path, pins_path: Path, restore_path: Path) -> None:
              if platform.system() != 'Linux' or platform.machine() not in ('x86_64', 'AMD64'):
                  raise RuntimeError('This exporter targets Linux x86_64, not the host Mac toolchain')
              for cmd in ('git', 'tar', 'unzstd'):
                  if not shutil.which(cmd):
                      raise RuntimeError(f'Missing command: {cmd}')
              if work.exists():
                  raise RuntimeError(f'Refusing to reuse a preexisting build directory: {work}')
              work.mkdir(parents=True)
              output.mkdir(parents=True, exist_ok=True)
              logs = output/'logs'
              logs.mkdir(exist_ok=True)
              pins = json.loads(pins_path.read_text())
              if pins['toolchain'] != TOOLCHAIN or pins['lean_git_hash'] != LEAN_HASH:
                  raise RuntimeError('Pin file does not match this exporter')
              original = work/'before-relocation'/BUNDLE_NAME
              workspace, runtime = original/'workspace', original/'runtime'
              workspace.mkdir(parents=True)
              runtime.mkdir()
              (original/'receipts').mkdir()
              for name in ('lakefile.toml', 'lake-manifest.json', 'lean-toolchain'):
                  (workspace/name).write_text(pins['files'][name])
              (workspace/'Bell.lean').write_text('import Mathlib\n')
              archive = work/'lean-4.19.0-linux.tar.zst'
              print('Downloading the official pinned Lean release asset', flush=True)
              request = urllib.request.Request(ASSET, headers={'User-Agent': 'Bell-Lean-Offline-Exporter'})
              with urllib.request.urlopen(request, timeout=120) as response, archive.open('wb') as target:
                  shutil.copyfileobj(response, target, 1024*1024)
              if archive.stat().st_size != ASSET_BYTES:
                  raise RuntimeError('Official release asset size differs from the inspected metadata')
              release_sha = sha(archive)
              run(['tar', '--use-compress-program=unzstd', '-xf', str(archive),
                   '--strip-components=1', '-C', str(runtime)], work, logs/'release-extract.log')
              env = os.environ.copy()
              env['PATH'] = str(runtime/'bin') + os.pathsep + env.get('PATH', '')
              env.pop('LEAN_SYSROOT', None)
              env.pop('LEAN_PATH', None)
              _, git_hash = run([str(runtime/'bin/lean'), '--githash'], workspace,
                                 logs/'official-lean-githash.log', env)
              if git_hash.strip() != LEAN_HASH:
                  raise RuntimeError('Release binary revision does not match the official v4.19.0 tag')
              packages = workspace/'.lake/packages'
              packages.mkdir(parents=True)
              manifest = json.loads(pins['files']['lake-manifest.json'])
              print('Cloning all nine dependencies at their exact recorded commits', flush=True)
              with ThreadPoolExecutor(max_workers=3) as pool:
                  list(pool.map(lambda p: fetch_dependency(p, packages, logs), manifest['packages']))
              run([str(runtime/'bin/lake'), 'exe', 'cache', 'get'], workspace, logs/'mathlib-cache.log', env)
              if json.loads((workspace/'lake-manifest.json').read_text()) != manifest:
                  raise RuntimeError('Lake altered the pinned manifest; refusing to export a different environment')
              # Retain exact original formatting after verifying semantic identity.
              (workspace/'lake-manifest.json').write_text(pins['files']['lake-manifest.json'])
              revisions = {}
              for pkg in manifest['packages']:
                  actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'],
                              cwd=packages/pkg['name'], text=True).strip()
                  if actual != pkg['rev']:
                      raise RuntimeError('A dependency revision changed during cache acquisition')
                  revisions[pkg['name']] = actual
              _, lean_path_text = run([str(runtime/'bin/lake'), 'env', 'printenv', 'LEAN_PATH'],
                                      workspace, logs/'lean-path.log', env)
              relative_paths = []
              for item in lean_path_text.strip().split(os.pathsep):
                  if not item:
                      continue
                  absolute = Path(item)
                  if not absolute.is_absolute():
                      absolute = workspace/absolute
                  relative_paths.append(absolute.resolve().relative_to(original.resolve()).as_posix())
              core = 'runtime/lib/lean'
              if core not in relative_paths:
                  relative_paths.append(core)
              write_json(original/'lean-paths.json', relative_paths)
              write_json(original/'pins.json', pins)
              first = smoke(original, relative_paths, 'before-relocation')
              relocated_parent = work/'after-relocation'
              relocated_parent.mkdir()
              root = relocated_parent/BUNDLE_NAME
              original.rename(root)
              if original.exists():
                  raise RuntimeError('Relocation did not remove the original path')
              second = smoke(root, relative_paths, 'after-relocation')
              moved_env = os.environ.copy()
              moved_env['PATH'] = str(root/'runtime/bin') + os.pathsep + moved_env.get('PATH', '')
              moved_env.pop('LEAN_PATH', None)
              moved_env.pop('LEAN_SYSROOT', None)
              run([str(root/'runtime/bin/lake'), 'env', 'lean', 'EnvironmentSmoke.lean'],
                  root/'workspace', root/'receipts/relocated-lake-positive.log', moved_env)
              shutil.copy2(restore_path, root/'restore_environment.py')
              receipt = {'status': 'smoke_tests_passed', 'toolchain': TOOLCHAIN,
                  'lean_git_hash': LEAN_HASH, 'dependency_revisions': revisions,
                  'positive_and_negative_tests': [first, second], 'paper_kernel_checked': False,
                  'scope': 'Toolchain and Mathlib smoke tests, NOT the Bell project or the paper.',
                  'workflow_provenance': {k: os.environ.get(k) for k in
                       ('BELL_EXPORT_REPOSITORY', 'BELL_EXPORT_COMMIT', 'BELL_EXPORT_RUN_ID')},
                  'release_asset': {'url': ASSET, 'bytes': ASSET_BYTES, 'sha256': release_sha,
                      'upstream_digest_available': False,
                      'note': 'SHA-256 is computed here; upstream metadata supplied no digest.'}}
              write_json(root/'receipts/environment.json', receipt)
              excluded = []
              raw_bytes = 0
              def filter_member(member: tarfile.TarInfo) -> tarfile.TarInfo | None:
                  nonlocal raw_bytes
                  path = Path(member.name)
                  if path.suffix.lower() in FONT_SUFFIXES or '__pycache__' in path.parts:
                      excluded.append(member.name)
                      return None
                  if member.isfile():
                      raw_bytes += member.size
                  return member
              bundled = output/'bell-lean419-linux-x64.tar.gz'
              print('Packaging the relocated environment and recording transfer checksums', flush=True)
              with tarfile.open(bundled, 'w:gz', compresslevel=1, dereference=False) as tf:
                  tf.add(root, arcname=BUNDLE_NAME, filter=filter_member)
              parts = []
              with bundled.open('rb') as f:
                  for index in range(MAX_PARTS+1):
                      data = f.read(PART_BYTES)
                      if not data:
                          break
                      if index == MAX_PARTS:
                          raise RuntimeError('Bundle exceeds the workflow artifact slots; no completion manifest emitted')
                      part = output/f'{PART_PREFIX}{index:02d}'
                      part.write_bytes(data)
                      parts.append({'index': index, 'name': part.name, 'bytes': len(data),
                                    'sha256': hashlib.sha256(data).hexdigest()})
              complete = {'schema': 'bell-lean-offline/v1',
                  'created_at_utc': datetime.now(timezone.utc).isoformat(),
                  'platform': 'linux-x86_64', 'toolchain': TOOLCHAIN, 'lean_git_hash': LEAN_HASH,
                  'payload_root': BUNDLE_NAME, 'archive_bytes': bundled.stat().st_size,
                  'archive_sha256': sha(bundled), 'unpacked_regular_bytes': raw_bytes,
                  'parts': parts, 'max_part_bytes': PART_BYTES, 'dependency_revisions': revisions,
                  'config_sha256': {name: hashlib.sha256(text.encode()).hexdigest()
                                    for name, text in pins['files'].items()},
                  'smoke_receipt': receipt, 'excluded_nonessential_paths': excluded,
                  'paper_kernel_checked': False, 'full_paper_proved': False}
              write_json(output/'environment-manifest.json', complete)
              shutil.copy2(restore_path, output/'restore_environment.py')
              shutil.copytree(root/'receipts', output/'receipts', dirs_exist_ok=True)
              (output/'PARTS.sha256').write_text(''.join(f"{p['sha256']}  {p['name']}\n" for p in parts))
              bundled.unlink()  # separately uploaded parts are the retained transfer representation
              print(json.dumps({'parts': len(parts), 'manifest': str(output/'environment-manifest.json'),
                                'paper_kernel_checked': False}, indent=2), flush=True)
          
          
          def main() -> int:
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument('--work', type=Path, required=True)
              parser.add_argument('--output', type=Path, required=True)
              parser.add_argument('--pins', type=Path, required=True)
              parser.add_argument('--restore', type=Path, required=True)
              args = parser.parse_args()
              try:
                  export(args.work.resolve(), args.output.resolve(), args.pins.resolve(), args.restore.resolve())
              except Exception as exc:
                  args.output.mkdir(parents=True, exist_ok=True)
                  write_json(args.output/'export-failure.json', {
                      'status': 'failed', 'error': str(exc), 'paper_kernel_checked': False})
                  raise
              return 0
          
          if __name__ == '__main__':
              raise SystemExit(main())
          BELL_EOF_EXPORT_ENVIRONMENT_PY
          cat > restore_environment.py <<'BELL_EOF_RESTORE_ENVIRONMENT_PY'
          #!/usr/bin/env python3
          """Restore a split Linux Lean 4.19/Mathlib export without Internet access.
          
          Accepts raw part files or the ZIP artifacts returned by GitHub. Transfer hashes
          are integrity checks, not a signature on an untrusted producer. Use exports from
          an inspected workflow run. Default mode runs positive AND negative Lean smoke
          checks after extraction. --extract-only makes NO compiler-verification claim.
          """
          from __future__ import annotations
          import argparse
          from contextlib import contextmanager
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import platform
          import posixpath
          import re
          import shutil
          import subprocess
          import tarfile
          import tempfile
          import zipfile
          
          LEAN_HASH = '6caaee842e9495688c1567e78c0e68dbb96942aa'
          TOOLCHAIN = 'leanprover/lean4:v4.19.0'
          BUNDLE_NAME = 'bell-lean419-environment'
          PART_PREFIX = 'bell-lean419-linux-x64.tar.gz.part-'
          MAX_PART_BYTES = 400*1024*1024
          
          
          def write_json(path: Path, value: object) -> None:
              path.write_text(json.dumps(value, indent=2, sort_keys=True)+'\n')
          
          
          @contextmanager
          def open_source(source: tuple[Path, str | None]):
              path, member = source
              if member is None:
                  with path.open('rb') as f:
                      yield f
              else:
                  with zipfile.ZipFile(path) as z, z.open(member) as f:
                      yield f
          
          
          def locate(directory: Path, name: str) -> list[tuple[Path, str | None]]:
              found = [(p, None) for p in directory.rglob(name) if p.is_file()]
              for p in sorted(directory.rglob('*.zip')):
                  with zipfile.ZipFile(p) as z:
                      for info in z.infolist():
                          if not info.is_dir() and PurePosixPath(info.filename).name == name:
                              found.append((p, info.filename))
              return found
          
          
          def load_manifest(directory: Path, explicit: Path | None) -> dict:
              if explicit is not None and explicit.suffix.lower() != '.zip':
                  data = explicit.read_bytes()
              else:
                  locations = (locate(directory, 'environment-manifest.json') if explicit is None
                               else [(explicit, i.filename) for i in zipfile.ZipFile(explicit).infolist()
                                     if PurePosixPath(i.filename).name == 'environment-manifest.json'])
                  if not locations:
                      raise ValueError('No environment-manifest.json found in raw files or artifact ZIPs')
                  alternatives = []
                  for source in locations:
                      with open_source(source) as f:
                          content = f.read(4*1024*1024+1)
                      if len(content) > 4*1024*1024:
                          raise ValueError('Oversized manifest')
                      alternatives.append(content)
                  if len(set(alternatives)) != 1:
                      raise ValueError('Conflicting manifests; select the correct one with --manifest')
                  data = alternatives[0]
              result = json.loads(data)
              validate_manifest(result)
              return result
          
          
          def validate_manifest(m: dict) -> None:
              if m.get('schema') != 'bell-lean-offline/v1':
                  raise ValueError('Unsupported manifest schema')
              if (m.get('lean_git_hash') != LEAN_HASH or m.get('toolchain') != TOOLCHAIN
                      or m.get('platform') != 'linux-x86_64' or m.get('payload_root') != BUNDLE_NAME):
                  raise ValueError('Unexpected platform/toolchain/payload pins')
              parts = m.get('parts')
              if not isinstance(parts, list) or not (1 <= len(parts) <= 12):
                  raise ValueError('Invalid part count')
              for i, p in enumerate(parts):
                  if p.get('index') != i or p.get('name') != f'{PART_PREFIX}{i:02d}':
                      raise ValueError('Parts must be contiguous and canonically named')
                  if not isinstance(p.get('bytes'), int) or not (0 < p['bytes'] <= MAX_PART_BYTES):
                      raise ValueError('Invalid part length')
                  if not re.fullmatch(r'[0-9a-f]{64}', p.get('sha256', '')):
                      raise ValueError('Invalid part SHA-256')
              if sum(p['bytes'] for p in parts) != m.get('archive_bytes'):
                  raise ValueError('Part sizes do not sum to the archive size')
              if not re.fullmatch(r'[0-9a-f]{64}', m.get('archive_sha256', '')):
                  raise ValueError('Invalid archive hash')
              if not isinstance(m.get('unpacked_regular_bytes'), int) or m['unpacked_regular_bytes'] < 0:
                  raise ValueError('Invalid unpacked size')
              if m.get('paper_kernel_checked') is not False or m.get('full_paper_proved') is not False:
                  raise ValueError('An environment export must not claim the paper is proved')
          
          
          def combine(directory: Path, manifest: dict, destination: Path) -> None:
              whole = hashlib.sha256()
              with destination.open('xb') as target:
                  for part in manifest['parts']:
                      candidates = locate(directory, part['name'])
                      if not candidates:
                          raise ValueError(f"Missing part: {part['name']}")
                      # Refuse ambiguous duplicate representations rather than guessing.
                      if len(candidates) != 1:
                          raise ValueError(f"Duplicate part {part['name']}; use a directory with one copy per part")
                      digest = hashlib.sha256()
                      count = 0
                      with open_source(candidates[0]) as f:
                          for chunk in iter(lambda: f.read(1024*1024), b''):
                              count += len(chunk)
                              if count > part['bytes']:
                                  raise ValueError('Part longer than the manifest declares')
                              digest.update(chunk)
                              whole.update(chunk)
                              target.write(chunk)
                      if count != part['bytes'] or digest.hexdigest() != part['sha256']:
                          raise ValueError(f"Part integrity failure: {part['name']}")
              if whole.hexdigest() != manifest['archive_sha256']:
                  raise ValueError('Combined archive SHA-256 mismatch')
          
          
          def safe_name(name: str) -> PurePosixPath:
              path = PurePosixPath(name)
              if '\\' in name or '\x00' in name or path.is_absolute() or '..' in path.parts:
                  raise ValueError(f'Unsafe archive path: {name!r}')
              if not path.parts or path.parts[0] != BUNDLE_NAME:
                  raise ValueError('All archive entries must be inside the one expected payload directory')
              return path
          
          
          def extract(archive: Path, directory: Path, expected_bytes: int) -> Path:
              seen = set()
              hardlinks = []
              directory_modes = []
              total = 0
              root = directory/BUNDLE_NAME
              with tarfile.open(archive, 'r|gz') as tf:
                  for member in tf:
                      relative = safe_name(member.name)
                      if relative.as_posix() in seen:
                          raise ValueError(f'Duplicate archive entry: {relative}')
                      seen.add(relative.as_posix())
                      target = directory.joinpath(*relative.parts)
                      # Resolve every existing parent, rejecting an archive symlink escape.
                      if not target.parent.resolve().is_relative_to(directory.resolve()):
                          raise ValueError('Archive parent escapes the extraction directory')
                      target.parent.mkdir(parents=True, exist_ok=True)
                      if member.isdir():
                          target.mkdir(exist_ok=True)
                          if target.is_symlink():
                              raise ValueError('Directory collides with symlink')
                          directory_modes.append((target, member.mode & 0o777))
                      elif member.isfile():
                          total += member.size
                          if total > expected_bytes:
                              raise ValueError('Archive exceeds the declared unpacked size')
                          source = tf.extractfile(member)
                          if source is None:
                              raise ValueError('Missing archive file stream')
                          with source, target.open('xb') as f:
                              shutil.copyfileobj(source, f, 1024*1024)
                          os.chmod(target, member.mode & 0o777)
                      elif member.issym():
                          link = member.linkname
                          if PurePosixPath(link).is_absolute() or '\\' in link or '\x00' in link:
                              raise ValueError('Unsafe symlink')
                          normalized = posixpath.normpath(posixpath.join(str(relative.parent), link))
                          safe_name(normalized)
                          os.symlink(link, target)
                      elif member.islnk():
                          link = safe_name(member.linkname)
                          hardlinks.append((target, directory.joinpath(*link.parts)))
                      else:
                          raise ValueError('Archive contains a device, FIFO, or other unsupported entry')
              if total != expected_bytes:
                  raise ValueError('Unpacked regular-file byte count does not match the manifest')
              while hardlinks:
                  pending = []
                  made = 0
                  for target, source in hardlinks:
                      if source.is_file() and not source.is_symlink():
                          if not source.resolve().is_relative_to(root.resolve()):
                              raise ValueError('Hardlink escapes payload')
                          os.link(source, target)
                          made += 1
                      else:
                          pending.append((target, source))
                  if not made:
                      raise ValueError('Unresolved or cyclic hardlinks')
                  hardlinks = pending
              for path, mode in reversed(directory_modes):
                  os.chmod(path, mode)
              return root
          
          
          def execute(command: list[str], cwd: Path, env: dict[str, str], log: Path) -> tuple[int, str]:
              with log.open('w') as output:
                  p = subprocess.run(command, cwd=cwd, env=env, stdout=output,
                                     stderr=subprocess.STDOUT, check=False)
              return p.returncode, log.read_text(errors='replace')
          
          
          def validate_restored(root: Path, manifest: dict) -> dict:
              if platform.system() != 'Linux' or platform.machine() not in ('x86_64', 'AMD64'):
                  raise ValueError('Executing this toolchain requires Linux x86_64; use --extract-only for byte checks elsewhere')
              receipts = root/'restore-receipts'
              receipts.mkdir()
              workspace = root/'workspace'
              for name, expected in manifest['config_sha256'].items():
                  if name not in ('lakefile.toml', 'lake-manifest.json', 'lean-toolchain'):
                      raise ValueError('Unexpected configuration filename')
                  if hashlib.sha256((workspace/name).read_bytes()).hexdigest() != expected:
                      raise ValueError('Extracted configuration hash mismatch')
              packages = json.loads((workspace/'lake-manifest.json').read_text())['packages']
              for p in packages:
                  code, actual = execute(['git', 'rev-parse', 'HEAD'], workspace/'.lake/packages'/p['name'],
                                        os.environ.copy(), receipts/f"{p['name']}-head.log")
                  if code or actual.strip() != p['rev'] or manifest['dependency_revisions'][p['name']] != p['rev']:
                      raise ValueError(f"Dependency revision mismatch: {p['name']}")
              relative_paths = json.loads((root/'lean-paths.json').read_text())
              for relative in relative_paths:
                  candidate = (root/relative).resolve()
                  if not candidate.is_relative_to(root.resolve()):
                      raise ValueError('Library search path escapes the restored environment')
              env = os.environ.copy()
              env['PATH'] = str(root/'runtime/bin') + os.pathsep + env.get('PATH', '')
              env['LEAN_PATH'] = os.pathsep.join(str(root/p) for p in relative_paths)
              env.pop('LEAN_SYSROOT', None)
              lean = str(root/'runtime/bin/lean')
              code, text = execute([lean, '--githash'], workspace, env, receipts/'githash.log')
              if code or text.strip() != LEAN_HASH:
                  raise ValueError('Restored Lean revision mismatch or executable failure')
              code, version = execute([lean, '--version'], workspace, env, receipts/'version.log')
              if code:
                  raise ValueError('Cannot run restored Lean')
              code, text = execute([lean, 'EnvironmentSmoke.lean'], workspace, env, receipts/'positive.log')
              if code or 'sorryAx' in text:
                  raise ValueError('Restored positive Lean test failed; inspect restore-receipts/positive.log')
              negative, text = execute([lean, 'EnvironmentNegative.lean'], workspace, env, receipts/'negative.log')
              if negative == 0 or 'unsolved goals' not in text:
                  raise ValueError('Restored negative Lean test did not fail for the expected reason')
              result = {'status': 'environment_smoke_passed', 'lean_git_hash': LEAN_HASH,
                        'lean_version': version.strip(), 'positive_exit': code,
                        'negative_exit': negative, 'paper_kernel_checked': False,
                        'full_paper_proved': False, 'note': 'No Bell theorem was checked by these smoke tests.'}
              write_json(receipts/'result.json', result)
              return result
          
          
          def attach_project(root: Path, project: Path, build: bool) -> dict:
              project = project.resolve()
              workspace = root/'workspace'
              if (project/'lean-toolchain').read_text().strip() != TOOLCHAIN:
                  raise ValueError('Project toolchain pin differs')
              if json.loads((project/'lake-manifest.json').read_text()) != json.loads((workspace/'lake-manifest.json').read_text()):
                  raise ValueError('Project dependency manifest differs from the exported environment')
              if (project/'lakefile.toml').read_bytes() != (workspace/'lakefile.toml').read_bytes():
                  raise ValueError('Project Lake configuration differs')
              destination = project/'.lake/packages'
              source = workspace/'.lake/packages'
              destination.parent.mkdir(exist_ok=True)
              if os.path.lexists(destination):
                  if not destination.is_symlink() or destination.resolve() != source.resolve():
                      raise ValueError('Project already has dependencies; refusing to replace them')
              else:
                  destination.symlink_to(source, target_is_directory=True)
              result = {'dependencies_attached_to': str(project), 'build_invoked': False,
                        'paper_kernel_checked': False, 'full_paper_proved': False}
              if build:
                  env = os.environ.copy()
                  env['PATH'] = str(root/'runtime/bin')+os.pathsep+env.get('PATH', '')
                  env.pop('LEAN_PATH', None)
                  env.pop('LEAN_SYSROOT', None)
                  report = project/'reports/offline-build.log'
                  report.parent.mkdir(exist_ok=True)
                  code, text = execute(['bash', 'scripts/check.sh'], project, env, report)
                  result.update({'build_invoked': True, 'build_exit': code, 'build_log': str(report),
                                 'note': 'Inspect the project kernel report; even a subset build does not prove the full paper.'})
                  print(text[-12000:])
              return result
          
          
          def main() -> int:
              p = argparse.ArgumentParser(description=__doc__)
              p.add_argument('--parts', type=Path, required=True)
              p.add_argument('--output', type=Path, required=True)
              p.add_argument('--manifest', type=Path)
              p.add_argument('--extract-only', action='store_true')
              p.add_argument('--project', type=Path)
              p.add_argument('--build-project', action='store_true')
              args = p.parse_args()
              if args.build_project and (args.project is None or args.extract_only):
                  p.error('--build-project requires --project and compiler validation')
              if args.extract_only and args.project is not None:
                  p.error('--extract-only cannot attach or build a project')
              output = args.output.resolve()
              if os.path.lexists(output):
                  raise SystemExit(f'Refusing to overwrite existing output: {output}')
              output.parent.mkdir(parents=True, exist_ok=True)
              manifest = load_manifest(args.parts.resolve(), args.manifest)
              needed = manifest['archive_bytes']+manifest['unpacked_regular_bytes']+64*1024*1024
              if shutil.disk_usage(output.parent).free < needed:
                  raise SystemExit('Insufficient free disk for assembly and extraction')
              with tempfile.TemporaryDirectory(prefix='.bell-restore-', dir=output.parent) as tmp:
                  temporary = Path(tmp)
                  archive = temporary/'payload.tar.gz'
                  combine(args.parts.resolve(), manifest, archive)
                  root = extract(archive, temporary/'extracted', manifest['unpacked_regular_bytes'])
                  root.rename(output)
              write_json(output/'transfer-manifest.json', manifest)
              result = {'status': 'bytes_restored_not_compiler_checked', 'output': str(output),
                        'paper_kernel_checked': False, 'full_paper_proved': False}
              if not args.extract_only:
                  try:
                      result.update(validate_restored(output, manifest))
                      if args.project is not None:
                          result['project'] = attach_project(output, args.project, args.build_project)
                  except Exception as exc:
                      write_json(output/'restore-status.json', {**result, 'status': 'validation_failed', 'error': str(exc)})
                      raise
              write_json(output/'restore-status.json', result)
              print(json.dumps(result, indent=2))
              return result.get('project', {}).get('build_exit', 0)
          
          if __name__ == '__main__':
              raise SystemExit(main())
          BELL_EOF_RESTORE_ENVIRONMENT_PY
          cat > pins.json <<'BELL_EOF_PINS_JSON'
