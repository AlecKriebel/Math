<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <defs>
    <style>
      .node { fill: #ffffff; stroke: #16324f; stroke-width: 3; }
      .center-node { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 3; }
      .strong { stroke: #16324f; stroke-width: 5; }
      .weak { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; }
      .outer { stroke: #c2410c; stroke-width: 1.5; stroke-dasharray: 3 6; opacity: .72; }
      .center-edge { stroke: #2563eb; stroke-width: 2.5; opacity: .8; }
      .label { font-family: ui-sans-serif, system-ui, sans-serif; fill: #172033; font-size: 22px; }
      .small { font-family: ui-sans-serif, system-ui, sans-serif; fill: #334155; font-size: 18px; }
      .weight { font-family: ui-monospace, SFMono-Regular, monospace; fill: #7c2d12; font-size: 18px; }
    </style>
  </defs>

  <rect width="1000" height="560" fill="#fafafa"/>
  <text x="500" y="38" text-anchor="middle" class="label">Center clique with N² singular-triangle satellites</text>

  <!-- Center clique -->
  <circle cx="500" cy="268" r="128" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <line x1="500" y1="170" x2="590" y2="235" class="center-edge"/>
  <line x1="590" y1="235" x2="555" y2="345" class="center-edge"/>
  <line x1="555" y1="345" x2="445" y2="345" class="center-edge"/>
  <line x1="445" y1="345" x2="410" y2="235" class="center-edge"/>
  <line x1="410" y1="235" x2="500" y2="170" class="center-edge"/>
  <line x1="500" y1="170" x2="555" y2="345" class="center-edge"/>
  <line x1="500" y1="170" x2="445" y2="345" class="center-edge"/>
  <line x1="590" y1="235" x2="445" y2="345" class="center-edge"/>
  <line x1="590" y1="235" x2="410" y2="235" class="center-edge"/>
  <line x1="555" y1="345" x2="410" y2="235" class="center-edge"/>
  <circle cx="500" cy="170" r="14" class="center-node"/>
  <circle cx="590" cy="235" r="14" class="center-node"/>
  <circle cx="555" cy="345" r="14" class="center-node"/>
  <circle cx="445" cy="345" r="14" class="center-node"/>
  <circle cx="410" cy="235" r="14" class="center-node"/>
  <text x="500" y="268" text-anchor="middle" class="label">C<tspan baseline-shift="sub" font-size="15">N</tspan></text>
  <text x="500" y="292" text-anchor="middle" class="small">|C<tspan baseline-shift="sub" font-size="12">N</tspan>| = N</text>
  <text x="500" y="418" text-anchor="middle" class="weight">each center edge: z<tspan baseline-shift="sub" font-size="12">N</tspan> = N⁻³</text>

  <!-- Outer connections, representative only -->
  <line x1="410" y1="235" x2="170" y2="145" class="outer"/>
  <line x1="410" y1="235" x2="112" y2="245" class="outer"/>
  <line x1="410" y1="235" x2="228" y2="245" class="outer"/>
  <line x1="590" y1="235" x2="830" y2="145" class="outer"/>
  <line x1="590" y1="235" x2="772" y2="245" class="outer"/>
  <line x1="590" y1="235" x2="888" y2="245" class="outer"/>
  <line x1="500" y1="345" x2="500" y2="455" class="outer"/>
  <line x1="445" y1="345" x2="442" y2="515" class="outer"/>
  <line x1="555" y1="345" x2="558" y2="515" class="outer"/>

  <!-- Left triangle -->
  <line x1="112" y1="245" x2="228" y2="245" class="strong"/>
  <line x1="112" y1="245" x2="170" y2="145" class="weak"/>
  <line x1="228" y1="245" x2="170" y2="145" class="weak"/>
  <circle cx="112" cy="245" r="13" class="node"/>
  <circle cx="228" cy="245" r="13" class="node"/>
  <circle cx="170" cy="145" r="13" class="node"/>
  <text x="170" y="278" text-anchor="middle" class="weight">1</text>
  <text x="91" y="183" text-anchor="middle" class="weight">δ<tspan baseline-shift="sub" font-size="12">N</tspan></text>
  <text x="249" y="183" text-anchor="middle" class="weight">δ<tspan baseline-shift="sub" font-size="12">N</tspan></text>
  <text x="170" y="118" text-anchor="middle" class="small">L₁</text>

  <!-- Right triangle -->
  <line x1="772" y1="245" x2="888" y2="245" class="strong"/>
  <line x1="772" y1="245" x2="830" y2="145" class="weak"/>
  <line x1="888" y1="245" x2="830" y2="145" class="weak"/>
  <circle cx="772" cy="245" r="13" class="node"/>
  <circle cx="888" cy="245" r="13" class="node"/>
  <circle cx="830" cy="145" r="13" class="node"/>
  <text x="830" y="278" text-anchor="middle" class="weight">1</text>
  <text x="830" y="118" text-anchor="middle" class="small">L₂</text>

  <!-- Bottom representative triangle -->
  <line x1="442" y1="515" x2="558" y2="515" class="strong"/>
  <line x1="442" y1="515" x2="500" y2="455" class="weak"/>
  <line x1="558" y1="515" x2="500" y2="455" class="weak"/>
  <circle cx="442" cy="515" r="13" class="node"/>
  <circle cx="558" cy="515" r="13" class="node"/>
  <circle cx="500" cy="455" r="13" class="node"/>
  <text x="620" y="494" class="small">⋯ N² modules total</text>

  <text x="500" y="84" text-anchor="middle" class="weight">every center–module edge: ε<tspan baseline-shift="sub" font-size="12">N</tspan> = N⁻ᴺ³</text>
  <text x="500" y="110" text-anchor="middle" class="weight">triangle weak edges: δ<tspan baseline-shift="sub" font-size="12">N</tspan> = N⁻⁴</text>
</svg>
